<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CipherMDT</title>
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="mdt-overlay" class="hidden">
        <div id="mdt-container">

            <!-- ── Sidebar ── -->
            <nav id="mdt-sidebar">
                <div id="mdt-logo">
                    <div class="logo-hex">⬡</div>
                    <div>
                        <div class="logo-text">CIPHER<span>MDT</span></div>
                        <div class="logo-version">v1.0.0 · LIVE</div>
                    </div>
                </div>

                <div id="sidebar-search">
                    <div class="sidebar-search-wrap">
                        <span class="sidebar-search-icon">⌕</span>
                        <input type="text" id="sidebar-search-input" placeholder="Quick search..." autocomplete="off">
                    </div>
                </div>

                <!-- Built at runtime from the officer's department panel list (app.js) -->
                <ul id="mdt-nav"></ul>

                <div id="mdt-clock">
                    <div id="clock-time">00:00:00</div>
                    <div id="clock-date">Loading...</div>
                </div>

                <div id="mdt-officer-card">
                    <div class="officer-card-inner">
                        <div class="officer-avatar">👮</div>
                        <div class="officer-card-info">
                            <div id="officer-name">Loading...</div>
                            <div id="officer-sub">Badge #--- · ---</div>
                        </div>
                        <div class="status-dot off" id="officer-dot"></div>
                    </div>
                </div>

                <button id="mdt-close-btn" onclick="closeMDT()">
                    ✕ CLOSE MDT
                </button>
            </nav>

            <!-- ── Main Content ── -->
            <!-- Tab panels are created per-department at runtime (app.js) -->
            <main id="mdt-content"></main>

        </div>
    </div>

    <div id="toast-container"></div>

    <!-- Mini Dispatch Responder -->
    <div id="quick-dispatch" class="hidden">
        <div id="qd-header">
            <span id="qd-title">ACTIVE CALLS</span>
            <span id="qd-hint">↑↓ navigate · Enter respond · Esc close</span>
        </div>
        <div id="qd-list"></div>
        <div id="qd-footer">
            <span id="qd-selected-info"></span>
        </div>
    </div>

    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="js/app.js"></script>
    <script src="js/components/namesearch.js"></script>
    <script src="js/panels/officer.js"></script>
    <script src="js/panels/civilians.js"></script>
    <script src="js/panels/vehicles.js"></script>
    <script src="js/panels/warrants.js"></script>
    <script src="js/panels/bolos.js"></script>
    <script src="js/panels/records.js"></script>
    <script src="js/panels/penal.js"></script>
    <script src="js/panels/incidents.js"></script>
    <script src="js/panels/cad.js"></script>
    <script src="js/panels/bulletins.js"></script>
    <script src="js/panels/quickdispatch.js"></script>
    <script src="js/panels/mugshots.js"></script>
    <script src="js/panels/callhistory.js"></script>
    <script src="js/panels/shiftlog.js"></script>
    <script src="js/panels/map.js"></script>
    <script src="js/panels/ems.js"></script>
    <script src="js/panels/fire.js"></script>
</body>
</html>
